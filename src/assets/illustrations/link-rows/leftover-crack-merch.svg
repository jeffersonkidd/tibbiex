<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 560" width="455" height="560">
  <!-- The Leftover Crack merch pile: tee, the record out of its sleeve, a sticker and a raw-cut patch. A placeholder for a link row's print (content/links.ts),
       generated by scripts/draw-illustrations.py; edit it there: flat
       shapes in the site's palette, hand-lettered, with a paper sticker
       edge round the whole thing. -->
  <defs>
    <filter id="sticker" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="grown" />
      <feFlood flood-color="#FEDBD5" />
      <feComposite in2="grown" operator="in" result="edge" />
      <feMerge>
        <feMergeNode in="edge" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="canvas" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0.5 H4 M0.5 0 V4" stroke="#412B27" stroke-opacity="0.12" stroke-width="0.8" />
    </pattern>
  </defs>
